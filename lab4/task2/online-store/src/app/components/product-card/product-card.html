<div class="card">
  <img [src]="currentImage" [alt]="product.name" class="main-image">

  <div class="thumbnails">
    @for (img of product.images; track img) {
      <img [src]="img" (click)="changeImage(img)" [class.active]="img === currentImage">
    }
  </div>

  <h3>{{ product.name }}</h3>
  <p>{{ product.description }}</p>
  <div class="price">{{ product.price }} ₸</div>
  <div class="rating">⭐ {{ product.rating }}</div>

  <a [href]="product.link" target="_blank">Открыть в Kaspi</a>

  <button class="whatsapp" (click)="shareWhatsApp()">WhatsApp</button>
  <button class="telegram" (click)="shareTelegram()">Telegram</button>
</div>
